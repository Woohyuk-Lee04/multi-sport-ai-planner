<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Multi-Sport AI Planner</title>
</head>
<body>
    <h1 th:text="${appName}">Application Name</h1>

    <h2>Latest Workout</h2>

    <p>
        Sport:
        <span th:text="${workout.sport}">Sport</span>
    </p>
    <p>
        Distance:
        <span th:text="${workout.distance}">0</span> km
    </p>
    <p>
        Duration:
        <span th:text="${workout.duration}">0</span> minutes
    </p>
</body>
</html>
