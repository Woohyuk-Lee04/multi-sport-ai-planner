<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Multi-Sport AI Planner</title>
</head>
<body>
    <h1>Multi-Sport AI Planner</h1>
    <h2>Workout History</h2>

    <ul>
        <li th:each="workout : ${workouts}">
            <span th:text="${workout.sport}">Sport</span> -
            <span th:text="${workout.distance}">0</span> km -
            <span th:text="${workout.duration}">0</span> min
        </li>
    </ul>

</body>
</html>
